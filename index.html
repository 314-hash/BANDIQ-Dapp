<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BANDIQ DePIN — Bandwidth + Intelligence Network</title>
  <meta name="description" content="BANDIQ DePIN Bandwidth Network Dashboard and Explorer on Sidra Chain ($BNDQ).">
  <meta http-equiv="refresh" content="0; url=/dashboard/">
  <link rel="icon" type="image/jpeg" href="dashboard/bandiq_logo.jpg">
  <script>
    window.location.replace("/dashboard/");
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #06070d;
      color: #00f3ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .loader-box {
      background: rgba(10, 16, 28, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 380px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(0, 243, 255, 0.2);
      border-top-color: #00f3ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    p {
      margin: 0 0 16px;
      font-size: 13px;
      color: #8fa0b5;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #00f3ff, #7928ca);
      color: #06070d;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 20px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a.btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <h2>BANDIQ DePIN 2.0</h2>
    <p>Connecting to Bandwidth Network...</p>
    <a href="/dashboard/" class="btn">Launch Dashboard</a>
  </div>
</body>
</html>
